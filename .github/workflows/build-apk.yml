name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which build? (use UniversalFoss if unsure, ArmeabiFoss for most TV boxes)"
        required: true
        default: "UniversalFoss"
        type: choice
        options:
          - UniversalFoss
          - ArmeabiFoss
          - Arm64Foss
          - X86_64Foss
          - UniversalGms
          - ArmeabiGms
          - Arm64Gms

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The release build falls back to the debug keystore when no release keystore exists.
      # A fresh runner has no debug keystore, so create one.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: ./gradlew assemble${{ inputs.flavor }}Release --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vivimusic-${{ inputs.flavor }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
